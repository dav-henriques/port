<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>davi — visual artist</title>
<meta name="description" content="Davi — visual artist and designer based in Brazil. Visual identity, graphic design, photography and creative direction.">
<meta name="theme-color" content="#000000">

<!-- Fonts are self-hosted: no third-party request, works offline. -->
<link rel="preload" as="image" href="assets/wordmark-davi.webp">
<link rel="preload" as="image" href="assets/photo-davi.webp">
<link rel="preload" as="image" href="assets/polaroid-frame.webp">
<link rel="stylesheet" href="style.css">
</head>

<body>
<a class="skip-link" href="#board">Skip to work</a>

<!-- ============================================================ HERO -->
<main id="top">
<section class="hero" aria-labelledby="wordmark">
  <div class="stage stage--hero">

    <!-- star scribble -->
    <div class="piece piece--deco piece--star" aria-hidden="true"
         style="--x:19.6%;--y:33.3%;--w:11.1%;--rot:-25deg;--dur:11s;--delay:-3s;--amp:.55cqw;--spin:.7deg;--depth:.55;--in:.05s">
      <div class="piece__float"><div class="piece__art">
        <img src="assets/star.webp" alt="" width="320" height="300" decoding="async">
      </div></div>
    </div>

    <!-- polaroid + photo -->
    <div class="piece piece--polaroid"
         style="--x:33.7%;--y:50.0%;--w:20.5%;--rot:-3.2deg;--dur:13s;--delay:-1s;--amp:.5cqw;--spin:.4deg;--depth:.9;--in:.20s">
      <div class="piece__float"><div class="piece__art">
        <figure class="polaroid">
          <img class="polaroid__photo" src="assets/photo-davi.webp"
               alt="Davi, a young visual artist, photographed outdoors in a black t-shirt" width="418" height="503">
          <img class="polaroid__frame" src="assets/polaroid-frame.webp" alt="" width="590" height="721">
        </figure>
      </div></div>
    </div>

    <!-- wordmark: davi -->
    <div class="piece piece--wordmark"
         style="--x:54.2%;--y:42.5%;--w:23.2%;--rot:0deg;--dur:15s;--delay:-4s;--amp:.35cqw;--spin:.25deg;--depth:1.15;--in:.30s">
      <div class="piece__float"><div class="piece__art">
        <h1 class="wordmark" id="wordmark">
          <picture>
            <source srcset="assets/wordmark-davi-still.webp" media="(prefers-reduced-motion: reduce)">
            <img src="assets/wordmark-davi.webp" width="672" height="424" alt="davi" fetchpriority="high">
          </picture>
        </h1>
      </div></div>
    </div>

    <!-- ransom subtitle -->
    <div class="piece piece--tagline"
         style="--x:60.3%;--y:56.2%;--w:33.2%;--rot:0deg;--dur:17s;--delay:-7s;--amp:.3cqw;--spin:.2deg;--depth:1;--in:.42s">
      <div class="piece__float"><div class="piece__art">
        <p class="tagline">
          <picture>
            <source srcset="assets/wordmark-artist-still.webp" media="(prefers-reduced-motion: reduce)">
            <img src="assets/wordmark-artist.webp" width="960" height="196" alt="Visual artist">
          </picture>
        </p>
      </div></div>
    </div>

    <!-- purple globe scrap -->
    <div class="piece piece--deco piece--globe" aria-hidden="true"
         style="--x:76.0%;--y:33.0%;--w:14.5%;--rot:6.5deg;--dur:12s;--delay:-5s;--amp:.6cqw;--spin:.6deg;--depth:.45;--in:.12s">
      <div class="piece__float"><div class="piece__art">
        <img src="assets/globe-scrap.webp" alt="" width="418" height="324" decoding="async">
      </div></div>
    </div>

    <!-- oval scribble -->
    <div class="piece piece--deco piece--oval" aria-hidden="true"
         style="--x:82.7%;--y:66.7%;--w:14.4%;--rot:-20deg;--dur:14s;--delay:-2s;--amp:.7cqw;--spin:.9deg;--depth:.4;--in:.50s">
      <div class="piece__float"><div class="piece__art">
        <img src="assets/oval.webp" alt="" width="414" height="359" decoding="async">
      </div></div>
    </div>

    <!-- hazard tape -->
    <div class="piece piece--deco piece--tape" aria-hidden="true"
         style="--x:23.2%;--y:72.4%;--w:16.8%;--rot:17deg;--dur:10s;--delay:-6s;--amp:.5cqw;--spin:.5deg;--depth:.35;--in:.56s">
      <div class="piece__float"><div class="piece__art">
        <img src="assets/tape-hazard.webp" alt="" width="484" height="288" decoding="async">
      </div></div>
    </div>
  </div>
</section>
<script src="script.js" defer></script>
</body>
</html>
